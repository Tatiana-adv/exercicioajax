<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Perfil do GitHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <h1>Buscador de Perfis do GitHub</h1>
        <div class="search-container">
            <input type="text" id="username-input" placeholder="Digite um usuário do GitHub...">
            <button id="search-button">Buscar</button>
        </div>
        
        <div id="profile-container">
            <p class="initial-message">Digite um nome de usuário e clique em "Buscar" para ver as informações do perfil.</p>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
